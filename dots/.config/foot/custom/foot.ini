# This file will not be overwritten across dots-hyprland updates.
# It is included at the end of ~/.config/foot/foot.ini, so settings here win.
# Re-declare the section before each setting, e.g.:
#
# [main]
# font=JetBrainsMono Nerd Font:size=12
#
# A key combo can only be bound once. To reuse one the defaults already bind,
# unbind it first, e.g. to make Ctrl+Shift+C copy and Ctrl+C interrupt:
#
# [key-bindings]
# clipboard-copy=Control+Shift+c
# [text-bindings]
# \x03=none
